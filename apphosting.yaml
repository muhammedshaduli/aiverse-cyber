# Firebase App Hosting configuration file
# Reference documentation: https://firebase.google.com/docs/app-hosting/configure

# Set the Node.js runtime version
# App Hosting uses this to set up your build and run environment.
# Supported versions include: 18, 20, 22.
# By default, App Hosting uses the engine version specified in package.json or Node 20.

# Environment variables to pass during build and run time
# Note: For client-side Vite variables, they must be prefixed with VITE_ to be exposed to the client.
# Keep any sensitive api keys as secrets instead of plain text environment variables.
# env:
#   - name: VITE_APP_ENV
#     value: "production"

# Configures the underlying Cloud Run service instance specs for your app
runConfig:
  minInstances: 0       # Scale to 0 when idle to avoid any ongoing cost of cold instances
  maxInstances: 5       # Upper boundary to prevent run-away resource scaling
  concurrency: 80       # Maximum concurrent requests per instance
  cpu: 1                # Allocated CPUs per service instance
  memoryMiB: 512        # Dedicated RAM per instance in Megabytes
